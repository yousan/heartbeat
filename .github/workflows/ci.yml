name: ci

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["state/**"]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        run: shellcheck deploy/heartbeat-beat .github/scripts/*.sh tests/*.sh
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color
      - name: tests
        run: tests/check_test.sh

name: heartbeat check

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Send one test DM and do nothing else"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: heartbeat-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Send test DM
        if: ${{ inputs.test }}
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
        run: |
          now="$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST')"
          .github/scripts/notify.sh "🧪 ハートビート監視のテスト通知です (${now}) / Heartbeat monitor test message (${now})"

      - name: Check heartbeat
        if: ${{ !inputs.test }}
        env:
          LAST_BEAT: ${{ vars.LAST_BEAT }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
        run: .github/scripts/check.sh

      - name: Commit state
        if: ${{ !inputs.test }}
        run: |
          git add state/status.json
          if git diff --cached --quiet; then
            echo "state unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "state: $(jq -r .status state/status.json)"
          for _ in 1 2 3; do
            if git push -q origin HEAD:main; then exit 0; fi
            git pull -q --rebase origin main
          done
          echo "could not push the state file" >&2
          exit 1
